# Serves the live workspace and proxies the Runner API on one origin.
#
# This replaces Vite's dev-server proxy, and for the same reason it exists there:
# the browser must see a single origin, so there is no CORS to configure and the
# live-session WebSocket upgrade behaves identically in development and behind a
# reverse proxy in production.
#
# `${RUNNER_API_HOST}` and `${RUNNER_API_PORT}` are substituted at container
# start by nginx's own template entrypoint, so one image serves any environment.

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # The workspace is a single-page app: unknown paths are routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Built assets are content-hashed, so they can be cached hard. index.html
    # must not be, or a deploy would keep serving the old bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://${RUNNER_API_HOST}:${RUNNER_API_PORT};
        proxy_http_version 1.1;

        # The live session is a WebSocket. Without these three the upgrade is
        # silently downgraded to a plain request and the socket closes at once.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;

        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A live session holds a browser open and an execution can take minutes,
        # so the default 60s read timeout would cut healthy connections.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;

        # Server-sent events for /executions/:id/events: buffering here would
        # hold progress events until the stream ended, defeating the point.
        proxy_buffering off;
    }

    location = /openapi.json {
        proxy_pass http://${RUNNER_API_HOST}:${RUNNER_API_PORT}/openapi.json;
        proxy_set_header Host $host;
    }

    location = /health {
        proxy_pass http://${RUNNER_API_HOST}:${RUNNER_API_PORT}/health;
        proxy_set_header Host $host;
    }
}
