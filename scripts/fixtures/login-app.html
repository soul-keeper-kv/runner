<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sign in</title>
  </head>
  <body>
    <!--
      The login page for scripts/auth-demo.mjs.

      Separate from fixtures/login.html on purpose. That page fakes its success
      in an onclick handler, which is all the locator smoke test needs and is
      useless here: this form has to produce a *real* session cookie, because
      the demo's whole claim is that a later navigation reaches a page only a
      signed-in visitor can see.

      The field names are the ones RUNNER_AUTH_PROFILES refers to by accessible
      name — "Email", "Password", "Sign in" — so the Runner resolves them the
      same way it resolves any other target, with no selectors in the profile.
    -->
    <h1>Sign in</h1>

    <form id="loginForm" method="post" action="/login">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" placeholder="you@example.com" />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" />

      <button type="submit" data-testid="login-submit">Sign in</button>
    </form>

    <p data-testid="login-error" hidden>Those credentials were not accepted.</p>

    <script>
      // Shows the server's rejection without a full page repaint, so a failed
      // login is visible to a human watching the demo rather than only in a
      // status code.
      if (new URLSearchParams(window.location.search).get('error') === '1') {
        document.querySelector('[data-testid="login-error"]').hidden = false;
      }
    </script>
  </body>
</html>
