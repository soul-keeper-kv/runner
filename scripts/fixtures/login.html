<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Login</title>
  </head>
  <body>
    <!--
      A deliberately small page used by scripts/e2e-smoke.mjs.

      It carries the signals the locator engine is meant to discriminate on:
      a data-testid next to a hashed CSS-module class, two buttons that differ
      only by accessible name, labelled inputs, and a heading that only an
      assertion (not an action) would target.
    -->
    <h1 id="heading">Please sign in</h1>
    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" placeholder="you@example.com" />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" />

      <button
        type="button"
        class="css-1a2b3c btn-primary"
        data-testid="login-submit"
        onclick="document.getElementById('heading').textContent = 'Welcome back'"
      >
        Login
      </button>
      <button type="button" data-testid="cancel">Cancel</button>
    </form>
  </body>
</html>
